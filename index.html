function nearestJob(){let arr=[...blocks.values()].filter(b=>jobs.includes(b.type));arr.sort((a,b)=>(Math.abs(a.x-actor.x)+Math.abs(a.y-actor.y))-(Math.abs(b.x-actor.x)+Math.abs(b.y-actor.y)));go(arr[0].x,arr[0].y)}
function blockDialog(b){let s=spec(b.n),has=state.tools[s.type]>=s.tier;show('✨ '+tr('block'),`<div class="workarea"><div class="workicon">🎁</div><p class="desc">${tr('need')}: ${icons[s.type]} ${tr(types[s.type])} · ${tr('tier')} ${s.tier}</p><div class="progress"><i style="width:${b.hp/s.hp*100}%;background:#e8b649"></i></div><p>${b.hp} / ${s.hp}</p><button class="primary wide" data-hit="${key(b.x,b.y)}" ${has?'':'disabled'}>${has?tr('hit'):tr('upgrade')}</button>${has?'':`<button class="wide" data-action="shop">${tr('shop')}</button>`}</div>`)}
function interact(b){if(b.type==='shop')shop();else if(jobs.includes(b.type))job(b);else if(b.type==='block')blockDialog(b);else show('🚙 '+tr('car'),`<p class="desc">${tr('carDesc')}</p><button class="primary wide" data-action="ride">${tr('ride')}</button>`)}
function burst(x,y){for(let i=0;i<30;i++)particles.push({x,y,z:25,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,vz:2+Math.random()*5,life:1,color:['#ffd36f','#fff','#8fddb9','#b29beb','#ff9e91'][i%5]})}
function hit(k){let b=blocks.get(k);if(!b||b.type!=='block')return;let s=spec(b.n);if(state.tools[s.type]<s.tier)return;beep(450+100*(s.hp-b.hp));b.hp--;if(b.hp>0){blockDialog(b);return}let r=reward(b.n);state.coins+=r;state.stage++;burst(b.x,b.y);build();close();toast(`${tr('newland')} ✨ +${r} ●`);persist();hud()}
function findPath(tx,ty){let sx=Math.round(actor.x),sy=Math.round(actor.y),queue=[[sx,sy]],prev=new Map([[key(sx,sy),null]]);for(let i=0;i<queue.length;i++){let [x,y]=queue[i];if(x===tx&&y===ty){let route=[],k=key(x,y);while(prev.get(k)!==null){route.push(k.split(',').map(Number));k=prev.get(k)}return route.reverse()}for(let [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){let a=x+dx,b=y+dy,k=key(a,b);if(tiles.has(k)&&!blocks.has(k)&&!prev.has(k)){prev.set(k,key(x,y));queue.push([a,b])}}}return null}
function go(x,y){if(!tiles.has(key(x,y))){toast(tr('locked'));return}let b=blocks.get(key(x,y));if(travel){if(b){toast(tr('travel'));return}path=[];pending=null;actor={x,y};state.player={x,y};travel=false;burst(x,y);center();beep(900);persist();hud();return}let route;if(b){let routes=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>findPath(x+dx,y+dy)).filter(Boolean);routes.sort((a,b)=>a.length-b.length);route=routes[0];pending=b}else{route=findPath(x,y);pending=null}if(!route){pending=null;return}path=route;if(!path.length&&pending){let p=pending;pending=null;interact(p)}}
function menu(m){if(m==='help')help();if(m==='bag')bag();if(m==='jobs')nearestJob();if(m==='shop'){let b=[...blocks.values()].find(b=>b.type==='shop');go(b.x,b.y)}}
$('toolbar').onclick=e=>{let b=e.target.closest('[data-menu]');if(b)menu(b.dataset.menu)};
modal.onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.difficulty){state.jobDifficulty=+b.dataset.difficulty;persist();job(jobPlace);return}if(b.dataset.game!==undefined){gameAction(b.dataset.game,b.dataset.value);return}if(b.dataset.buy!==undefined){let i=+b.dataset.buy,c=cost(state.tools[i]+1);if(state.coins<c)return;state.coins-=c;state.tools[i]++;persist();hud();shop();beep(800);toast(tr('bought'));return}if(b.dataset.hit){hit(b.dataset.hit);return}switch(b.dataset.action){case'close':close();break;case'shop':shop();break;case'ride':travel=true;close();hud();break;case'jobstart':startJob();break;case'jobretry':job(jobPlace);break;case'sound':state.sound=!state.sound;persist();help();break;case'reset':show(tr('reset'),`<p class="desc">${tr('resetAsk')}</p><button class="wide" data-action="help">${tr('no')}</button><button class="primary wide" data-action="confirmreset">${tr('yes')}</button>`);break;case'help':help();break;case'confirmreset':{let lang=state.lang;state=fresh();state.lang=lang;actor={x:0,y:0};path=[];pending=null;travel=false;build();center();persist();hud();close();break}}};modal.addEventListener('close',()=>mini=null);
$('lang').onclick=()=>{state.lang=state.lang==='nl'?'en':'nl';persist();hud()};
function resize(){W=innerWidth;H=innerHeight;let dpr=Math.min(2,devicePixelRatio||1);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
function project(x,y,z=0){return{x:W/2+(x-y)*42*zoom+cam.x,y:H*.52+(x+y)*22*zoom+cam.y-z*zoom}}
function unproject(x,y){let a=(x-W/2-cam.x)/(42*zoom),b=(y-H*.52-cam.y)/(22*zoom);return{x:Math.round((a+b)/2),y:Math.round((b-a)/2)}}
function center(){cam.x=-(actor.x-actor.y)*42*zoom;cam.y=-(actor.x+actor.y)*22*zoom+(W<760?20:0)}
function setZoom(z){zoom=Math.max(.45,Math.min(1.7,z));center()}
$('zoomin').onclick=()=>setZoom(zoom+.15);$('zoomout').onclick=()=>setZoom(zoom-.15);$('home').onclick=center;
canvas.onpointerdown=e=>{pan={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{hover=unproject(e.clientX,e.clientY);if(pan){let dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(Math.hypot(dx,dy)>7)pan.moved=true;if(pan.moved){cam.x=pan.cx+dx;cam.y=pan.cy+dy}}};
canvas.onpointerup=e=>{if(pan&&!pan.moved){let found=null;for(let b of [...blocks.values()].sort((a,b)=>(b.x+b.y)-(a.x+a.y))){let p=project(b.x,b.y);if(Math.abs(e.clientX-p.x)<30*zoom&&e.clientY>p.y-65*zoom&&e.clientY<p.y+10*zoom){found=b;break}}let p=found||unproject(e.clientX,e.clientY);go(p.x,p.y)}pan=null};canvas.onpointercancel=()=>pan=null;
canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom-e.deltaY*.001)},{passive:false});
function move(dx,dy){if(modal.open||path.length)return;let x=Math.round(actor.x)+dx,y=Math.round(actor.y)+dy;go(x,y);center()}
document.addEventListener('keydown',e=>{if(modal.open)return;if(e.key==='Escape'){travel=false;hud();return}let dirs={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(dirs[e.key]){e.preventDefault();move(...dirs[e.key])}});$('mobilepad').onclick=e=>{if(e.target.dataset.dir)move(...e.target.dataset.dir.split(',').map(Number))};
function poly(points,fill,stroke){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function box(x,y,w,d,h,top,left,right){poly([[x-w,y],[x,y+d],[x,y+d-h],[x-w,y-h]],left);poly([[x,y+d],[x+w,y],[x+w,y-h],[x,y+d-h]],right);poly([[x-w,y-h],[x,y-d-h],[x+w,y-h],[x,y+d-h]],top)}
function textAt(s,x,y,size,color='#335954'){ctx.font=`800 ${size}px "Trebuchet MS",sans-serif`;ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(s,x,y)}
// Real refraction: sample the rendered world at magnified, curved coordinates.
// CSS highlights/blur provide a graceful fallback when Canvas is unavailable.
function glassify(){for(let el of document.querySelectorAll('.glass,dialog')){if(el.querySelector('.glass-lens'))continue;let lens=document.createElement('canvas');lens.className='glass-lens';lens.setAttribute('aria-hidden','true');el.prepend(lens)}}
function refractGlass(){if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let el of document.querySelectorAll('.glass,dialog[open]')){let lens=el.querySelector('.glass-lens');if(!lens)continue;let r=el.getBoundingClientRect();if(!r.width||!r.height)continue;let w=Math.round(r.width),h=Math.min(Math.round(r.height),innerHeight),scale=canvas.width/W;if(lens.width!==w)lens.width=w;if(lens.height!==h)lens.height=h;let c=lens.getContext('2d');if(!c)continue;c.clearRect(0,0,w,h);c.imageSmoothingEnabled=true;for(let y=0;y<h;y+=5){let band=Math.min(5,h-y),ny=(y-h/2)/(h/2),magnify=1.04+.055*(1-ny*ny),bend=Math.sin(ny*Math.PI)*3;let sx=r.left+w/2-w/(2*magnify)+bend,sy=r.top+h/2+(y-h/2)/1.07;let sw=w/magnify,sh=band/1.07;let left=Math.max(0,sx),top=Math.max(0,sy),right=Math.min(W,sx+sw),bottom=Math.min(H,sy+sh);if(right<=left||bottom<=top)continue;c.drawImage(canvas,left*scale,top*scale,(right-left)*scale,(bottom-top)*scale,(left-sx)*magnify,y,(right-left)*magnify,band)}let shine=c.createLinearGradient(0,0,w,h);shine.addColorStop(0,'#ffffff44');shine.addColorStop(.4,'#ffffff08');shine.addColorStop(.75,'#b9deff18');shine.addColorStop(1,'#ffe3ff33');c.fillStyle=shine;c.fillRect(0,0,w,h)}}

function tile(t,time,locked=false){let p=project(t.x,t.y),z=zoom;if(p.x<-100||p.x>W+100||p.y<-100||p.y>H+130)return;let colors=[['#b2dfbd','#80b696','#91c7a4'],['#c4dce6','#93b6c9','#a7c9d7'],['#dfcee9','#b39aca','#c4aed7'],['#eedbb6','#c4b28f','#dbc7a1']],c=colors[Math.floor(t.n/3)%4];if(locked)c=['#e0eae7','#c6d8d1','#d2dfda'];let selected=hover&&hover.x===t.x&&hover.y===t.y&&!locked;box(p.x,p.y,41*z,21*z,10*z,selected?'#e9fbd1':c[0],c[1],c[2]);poly([[p.x-40*z,p.y-10*z],[p.x,p.y-30*z],[p.x+40*z,p.y-10*z],[p.x,p.y+10*z]],'transparent',locked?'#ffffff30':'#ffffff45');if(!locked&&!blocks.has(key(t.x,t.y))&&((t.x*13+t.y*7)%7===0)){ellipse(p.x+10*z,p.y-12*z,2*z,2*z,'#f9f5bd');ellipse(p.x+16*z,p.y-9*z,1.5*z,1.5*z,'#ffffffaa')} }
function drawObject(b,time){let p=project(b.x,b.y),z=zoom;if(p.x<-100||p.x>W+100||p.y<-80||p.y>H+160)return;ctx.save();ctx.translate(p.x,p.y-11*z);ctx.scale(z,z);ellipse(0,4,25,10,'#3c73602b');if(b.type==='block'){let bob=Math.sin(time*.003)*2;ctx.translate(0,bob);box(0,0,23,12,35,'#ffe597','#e4aa40','#f6c455');textAt('?',11,-9,27,'#fff9e3');textAt('✦',-12,-12,13,'#fff1ba');ellipse(-13,-37,2,2,'#fff');if(state.stage>0)textAt(icons[spec(b.n).type],0,-51,18)}else if(b.type==='car'){ellipse(-18,4,6,8,'#47707a');ellipse(17,6,6,8,'#47707a');box(0,0,31,14,14,'#b1e7ed','#65bac9','#83d5dd');box(0,-13,20,10,17,'#e6faff','#86c3d0','#a6dfea');poly([[-17,-29],[-2,-22],[-2,-12],[-17,-19]],'#efffff');ellipse(25,-6,3,3,'#fff5c2')}else{let c=b.type==='shop'?['#fac7b6','#e79e91','#efb0a0']:b.type==='smith'?['#cad4ec','#9eabc8','#b5c0db']:b.type==='bakery'?['#efce9d','#caaa80','#e1bc8f']:b.type==='garden'?['#b9ddb6','#84b697','#99c9a3']:['#d9c8e9','#b19bc6','#c4aed8'];box(0,0,30,16,33,c[0],c[1],c[2]);box(0,-34,35,18,9,'#fff4df','#e5d4b9','#f4e5ce');poly([[-16,-4],[-5,2],[-5,-20],[-16,-26]],'#5d7e83');poly([[6,-23],[23,-31],[23,-16],[6,-8]],'#e8fbef');ctx.fillStyle='#eec560';ctx.fillRect(-1,-20,3,10);textAt(b.type==='shop'?'🛍️':jobIcons[b.type],0,-46,25);textAt(tr(b.type),0,29,11,'#477164')}
ctx.restore()}
function drawActor(time){let p=project(actor.x,actor.y),z=zoom,bounce=path.length?Math.sin(time*.018)*3:Math.sin(time*.002)*1.3;ctx.save();ctx.translate(p.x,p.y-10*z);ctx.scale(z,z);ellipse(0,2,13,6,'#39695a30');ctx.translate(0,bounce);ellipse(-5,-3,5,5,'#557c86');ellipse(5,-3,5,5,'#557c86');ellipse(0,-15,11,14,'#f49e8b');ellipse(-12,-15+Math.sin(time*.018)*(path.length?4:0),4,8,'#f9b6a1');ellipse(12,-15-Math.sin(time*.018)*(path.length?4:0),4,8,'#f9b6a1');let grad=ctx.createRadialGradient(-5,-39,1,0,-33,15);grad.addColorStop(0,'#fff7d6');grad.addColorStop(1,'#edc58e');ellipse(0,-34,14,14,grad);ellipse(4,-35,1.5,2,'#3d5a64');ellipse(-4,-35,1.5,2,'#3d5a64');ctx.beginPath();ctx.arc(0,-31,4,.15,Math.PI-.15);ctx.strokeStyle='#906958';ctx.lineWidth=1.5;ctx.stroke();ellipse(-8,-31,3,1.5,'#f5b49c');ellipse(8,-31,3,1.5,'#f5b49c');ctx.restore()}
function frame(time){let dt=Math.min((time-last)/1000,.04);last=time;if(path.length){let [x,y]=path[0],dx=x-actor.x,dy=y-actor.y,dist=Math.hypot(dx,dy),speed=dt*5;if(dist<=speed){actor={x,y};path.shift();if(!path.length){persist();if(pending){let p=pending;pending=null;interact(p)}}}else{actor.x+=dx/dist*speed;actor.y+=dy/dist*speed}let p=project(actor.x,actor.y);if(p.x<110||p.x>W-100||p.y<180||p.y>H-170){cam.x+=(W/2-p.x)*dt*4;cam.y+=(H*.55-p.y)*dt*4}}
ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#daf8ee');bg.addColorStop(.46,'#bfebe9');bg.addColorStop(1,'#e7d9f7');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.45;ellipse(W*.83,H*.22,180,55,'white');ellipse(W*.14,H*.73,170,50,'white');ctx.globalAlpha=1;let aura=ctx.createRadialGradient(W*.24,H*.26,0,W*.24,H*.26,W*.44);aura.addColorStop(0,'#fff4b75c');aura.addColorStop(1,'#fff4b700');ctx.fillStyle=aura;ctx.fillRect(0,0,W,H);
// Draw only visible tiles; the camera can explore all unlocked districts.
let visible=[...tiles.values()].filter(t=>{let p=project(t.x,t.y);return p.x>-120&&p.x<W+120&&p.y>-120&&p.y<H+150});let future=district(state.stage+1);for(let x=0;x<4;x++)for(let y=0;y<4;y++)tile({x:future.x*4-1+x,y:future.y*4-1+y,n:state.stage+1},time,true);visible.sort((a,b)=>(a.x+a.y)-(b.x+b.y));for(let t of visible)tile(t,time);
// Dotted border around each outside edge.
ctx.strokeStyle='#ffffffb0';ctx.lineWidth=2*zoom;ctx.setLineDash([5*zoom,5*zoom]);for(let t of visible){let p=project(t.x,t.y),z=zoom;for(let [dx,dy,a,b]of [[-1,0,[-42,0],[0,-22]],[0,-1,[0,-22],[42,0]],[1,0,[42,0],[0,22]],[0,1,[0,22],[-42,0]]])if(!tiles.has(key(t.x+dx,t.y+dy))){ctx.beginPath();ctx.moveTo(p.x+a[0]*z,p.y+(a[1]-10)*z);ctx.lineTo(p.x+b[0]*z,p.y+(b[1]-10)*z);ctx.stroke()}}ctx.setLineDash([]);
let objects=[...blocks.values(),{...actor,type:'player'}].sort((a,b)=>(a.x+a.y)-(b.x+b.y));for(let b of objects)b.type==='player'?drawActor(time):drawObject(b,time);
for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt*30;p.vz-=dt*9;p.life-=dt*.65;let a=project(p.x,p.y,p.z);ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(a.x,a.y,5*zoom,5*zoom)}particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;tickMini(time,dt);if(time-lastGlass>90){refractGlass();lastGlass=time;}requestAnimationFrame(frame)}
build();if(!tiles.has(key(Math.round(actor.x),Math.round(actor.y)))||blocks.has(key(Math.round(actor.x),Math.round(actor.y))))actor={x:0,y:0};resize();if(W<760)zoom=.8;center();hud();addEventListener('resize',()=>{resize();center()});addEventListener('pagehide',persist);requestAnimationFrame(frame);if(!state.seen)help();
})();
</script></body></html>
