function newPuzzle(kind,d){let p,signature;for(let i=0;i<30;i++){p=makePuzzle(kind,d);signature=JSON.stringify(p);if(signature!==state.lastPuzzle[kind])break}state.lastPuzzle[kind]=signature;persist();return p}
function routeResult(p){let at=p.start,got=p.pickup===null,trace=[at];for(let i=0;i<p.commands.length;i++){let dir=p.commands[i];if(!Number.isInteger(dir)||dir<0||dir>3)return {ok:false,message:'Invalid command',trace};let [dx,dy]=directions[dir],x=at%4+dx,y=Math.floor(at/4)+dy,n=y*4+x;if(x<0||x>3||y<0||y>3)return{ok:false,message:say(`Stap ${i+1}: je rijdt van de kaart. Pas de pijl aan.`,`Step ${i+1}: you drive off the map. Change that arrow.`),trace};if(p.walls.includes(n))return{ok:false,message:say(`Stap ${i+1}: daar staat een rots. Zoek een omweg.`,`Step ${i+1}: a rock blocks the way. Find a detour.`),trace};at=n;trace.push(at);if(at===p.pickup)got=true;if(at===p.goal&&!got)return{ok:false,message:say('Je bereikt het huis zonder pakket. Haal eerst 📦 op.','You reached the house without the parcel. Collect 📦 first.'),trace}}

function evaluatePuzzle(p){let k=p.kind,ok=false,message='';if(k==='metal'||k==='budget'){let total=countSum(p.counts,p.values),pieces=p.counts.reduce((a,b)=>a+b,0),spent=countSum(p.counts,p.prices);ok=total===p.target&&p.counts.every((n,i)=>Number.isInteger(n)&&n>=0&&n<=p.stock[i])&&(k==='budget'?spent<=p.budget:p.d===1||pieces===p.pieces);message=total!==p.target?say(`Je hebt ${total} metaal. ${total<p.target?`Er ontbreekt ${p.target-total}.`:`Dat is ${total-p.target} te veel.`}`,`You have ${total} metal. ${Math.abs(total-p.target)} ${total<p.target?'more needed':'too much'}.`):k==='budget'?say(`Je metaal klopt. Kosten: ${spent}; budget: ${p.budget}.`,`The metal is right. Cost: ${spent}; budget: ${p.budget}.`):say(`Je gewicht klopt. Je gebruikt ${pieces} stukken; gevraagd: ${p.pieces}.`,`The weight is right. You used ${pieces} pieces; requested: ${p.pieces}.`);if(ok)message=p.counts.map((n,i)=>`${n} × ${p.values[i]}`).join(' + ')+` = ${p.target}`}

else if(k==='change'){let total=countSum(p.counts,p.values),number=p.counts.reduce((a,b)=>a+b,0);ok=total===p.target&&number<=p.limit;message=ok?say(`Bestelling: ${p.quantity} × ${p.price} = ${p.total}. Terug: ${p.cash} − ${p.total} = ${p.target}.`,`Order: ${p.quantity} × ${p.price} = ${p.total}. Change: ${p.cash} − ${p.total} = ${p.target}.`):say(`Je geeft ${total} met ${number} munten (max. ${p.limit}). Bereken eerst ${p.quantity} × ${p.price}; trek die bestelling af van ${p.cash}.`,`You give ${total} with ${number} coins (max. ${p.limit}). First calculate ${p.quantity} × ${p.price}; subtract the order from ${p.cash}.`)}

function promptPuzzle(p){switch(p.kind){case'metal':return say(`Maak precies ${p.target} metaal${p.d>1?` met precies ${p.pieces} stukken`:''}. Let op de voorraad.`,`Make exactly ${p.target} metal${p.d>1?` with exactly ${p.pieces} pieces`:''}. Mind the stock.`);case'budget':return say(`Maak ${p.target} metaal. Je mag maximaal ${p.budget} munten uitgeven.`,`Make ${p.target} metal. Spend at most ${p.budget} coins.`);case'heatplan':return say(`De oven is ${p.start}°. Plan maximaal ${p.limit} bewerkingen om precies ${p.target}° te bereiken.`,`The furnace is ${p.start}°. Plan at most ${p.limit} operations to reach exactly ${p.target}°.`);case'recipe':return say(`Het recept is voor 1 bakronde. Maak genoeg voor ${p.batch} bakrondes.`,`The recipe makes 1 batch. Prepare enough for ${p.batch} batches.`);case'change':return say(`Een klant koopt ${p.quantity} broodjes van ${p.price} munten en betaalt ${p.cash}. Geef wisselgeld met maximaal ${p.limit} munten.`,`A customer buys ${p.quantity} rolls at ${p.price} coins and pays ${p.cash}. Give change using at most ${p.limit} coins.`);case'fraction':return say(`Versier ${p.numerator}/${p.denominator} van deze ${p.cells} koeken.`,`Decorate ${p.numerator}/${p.denominator} of these ${p.cells} cookies.`);case'rows':return say(`Plant in elke rij én elke kolom precies één bloem. Vermijd rotsen.${p.d===3?' Ook geen twee bloemen op dezelfde diagonaal (schuine lijn).':''}`,`Plant exactly one flower in every row AND every column. Avoid rocks.${p.d===3?' No two flowers on the same diagonal either.':''}`);case'water':return say(`Plant ${p.target} bloemen naast water (een zijde moet water raken).${p.d>1?' Planten mogen elkaar niet met een zijde raken.':''}`,`Plant ${p.target} flowers next to water (touching along an edge).${p.d>1?' Plants must not touch each other along an edge.':''}`);case'mirror':return say('Maak rechts het spiegelbeeld van de bloemen links.','Make the right side a reflection of the flowers on the left.');default:return say(`${ function hintPuzzle(p){if(p.hints<2){switch(p.kind){case'metal':case'budget':return say('Welke stukken passen binnen je doel? Hoeveel metaal ontbreekt daarna? Controleer ook het aantal of je budget.','Which pieces fit within your target? How much metal is left? Also check the piece count or budget.');case'heatplan':return say(`Je moet in totaal ${p.target-p.start}° veranderen. Combineer optellen en aftrekken.`,`You need a total change of ${p.target-p.start}°. Combine addition and subtraction.`);case'recipe':return say(`Elk ingrediënt moet ${p.batch} keer zoveel worden. Tel dezelfde hoeveelheid ${p.batch} keer op.`,`Each ingredient needs to be ${p.batch} times as much. Add the same amount ${p.batch} times.`);case'change':return say('Bereken eerst de hele bestelling. Trek dat af van het betaalde bedrag. Probeer daarna grote munten.','Calculate the whole order first. Subtract it from the payment. Then try large coins.');case'fraction':return say(`Maak eerst ${p.denominator} even grote groepjes. Neem er ${p.numerator}.`,`Make ${p.denominator} equal groups first. Take ${p.numerator} of them.`);case'rows':return say('Begin met de rij met de meeste rotsen. Gebruik daarna steeds een andere kolom.','Start with the row with the most rocks. Then use a different column each time.');case'water':return say('Zoek eerst alle vakjes direct boven of onder water. Laat bij Pittig en Expert ruimte tussen de planten.','Find squares directly above or below water first. Leave space between plants on Tricky and Expert.');case'mirror':return say('Tel voor elke bloem de afstand tot de middenlijn. Plaats de andere bloem even ver aan de overkant.','For each flower, count its distance from the middle. Place the other flower equally far across.');default:return say('Plan vanaf de auto. Een pijl verplaatst één vakje. Vermijd rotsen; haal het pakket eerst op als je het ziet.','Plan from the car. Each arrow moves one square. Avoid rocks; collect the parcel first if shown.')}}let solution=p.solution; function startJob(){if(!jobPlace)return;let b=jobPlace,offset=(state.jobSerial[b.type]||0)%3,order=curriculum[b.type].map((_,i)=>curriculum[b.type][(i+offset)%3]);state.jobSerial[b.type]=(offset+1)%3;persist();show(jobIcons[b.type]+' '+tr(b.type),'<div id="minigame"></div>');mini={type:b.type,n:b.n,d:state.jobDifficulty,index:0,order,outcomes:[],phase:'solve',paid:false};loadPuzzle()}
function loadPuzzle(){let m=mini,k=m.order[m.index],d=m.d;m.puzzle=newPuzzle(k,d);m.phase='solve';m.carry=null;renderMini()}
function renderMini(){let m=mini;if(!m)return;let p=m.puzzle;let isRoute=['route','pickup','debug'].includes(p.kind);$('minigame').innerHTML=`<div class="game-meta"><span>${say('Opdracht','Task')} ${m.index+1}/3</span><span>${say('Niveau','Level')} ${p.d}</span><span>${p.transfer?say('Nog eens toepassen','Apply it again'):'⭐ '+m.outcomes.length+'/3'}</span></div><div class="game-board"><h3>${skillNames[state.lang][p.kind]}</h3><p>${promptPuzzle(p)}</p>${puzzleUI(p)}<div class="learning-feedback ${m.phase==='solved'?'success':''}" role="status" aria-live="polite">${p.feedback||say('Neem de tijd. Pas je plan aan voordat je het controleert.','Take your time. Adjust your plan before checking.')}</div>${m.phase==='transfer'?`<button class="primary wide" data-game="transfer">${say('Probeer een nieuwe variant','Try a new variation')}</button>`:m.phase==='solved'?`<button class="primary wide" data-game="next">${m.index===2?say('Bouwcontract afronden','Finish building contract'):say('Volgende uitdaging','Next challenge')}</button>`:`<button class="primary wide" data-game="check" ${m.running?'disabled':''}>${m.running?say('Je programma rijdt…','Your program is running…'):isRoute?say('Voer mijn route uit','Run my route'):say('Controleer mijn plan','Check my plan')}</button><div class="support-actions"><button data-game="hint">💡 ${say('Denkhulp','Hint')}</button><button data-game="clear">↺ ${say('Plan wissen','Clear plan')}</button></div>`}</div>`}
function solvePuzzle(){let m=mini;if(!m||m.phase!=='solve')return;let p=m.puzzle,r=evaluatePuzzle(p);p.attempts++;p.feedback=r.message;if(!r.ok){beep(240);renderMini();return}let mode=p.hints?'assisted':p.attempts>1?'repaired':'independent';if(!p.transfer&&mode!=='independent'){m.carry=mode;m.phase='transfer';p.feedback+=say(' ✓ Dit klopt! Hierna pas je hetzelfde idee nog een keer toe, met een andere opdracht.',' ✓ That works! Next, apply the same idea again to a different task.');renderMini();return}if(m.carry==='assisted'||mode==='assisted')mode='assisted';else if(m.carry||mode==='repaired')mode='repaired';let record=skill(p.kind);record[mode]++;record.levels=state.learning[p.kind]?.levels||{};let levelRecord=record.levels[p.d]||{independent:0,repaired:0,assisted:0};levelRecord[mode]++;record.levels[p.d]=levelRecord;state.learning[p.kind]=record;persist();m.outcomes.push({kind:p.kind,mode});m.phase='solved';p.solved=true;beep(850);renderMini()}
function gameAction(action,value){let m=mini;if(!m||m.paid||m.running)return;let p=m.puzzle,i=Number(value);if(action==='transfer'){if(m.phase!=='transfer')return;let next=newPuzzle(p.kind,p.d);next.transfer=true;next.feedback=say('Zelfde idee, nieuwe opdracht. Je eerdere hulp of herstel blijft geregistreerd.','Same idea, new task. Earlier help or repair stays recorded.');m.puzzle=next;m.phase='solve';renderMini();return}if(action==='next'){if(m.phase!=='solved')return;if(m.index===2){finishJob();return}m.index++;loadPuzzle();return}if(m.phase!=='solve')return;if(action==='check'){if(['route','pickup','debug'].includes(p.kind)){let r=routeResult(p);p.preview=[p.start];m.running={trace:r.trace,index:0,elapsed:0};renderMini()}else solvePuzzle();return}if(action==='hint'){p.hints++;p.feedback=hintPuzzle(p);renderMini();return}if(action==='clear'){p.counts=p.counts.map(()=>0);p.selected=[];p.commands=[];p.preview=null;p.editIndex=null}else if(action==='plus'||action==='minus'){if(!Number.isInteger(i)||i<0||i>=p.counts.length)return;p.counts[i]=Math.max(0,Math.min(p.stock?.[i]??40,p.counts[i]+(action==='plus'?1:-1)))}else if(action==='cell'){if(!Number.isInteger(i)||i<0||i>=(p.cells||16)||p.walls?.includes(i)||p.water?.includes(i)||(p.kind==='mirror'&&i%4<2))return;p.selected=p.selected.includes(i)?p.selected.filter(v=>v!==i):[...p.selected,i]}else if(action==='op'){let limit=p.kind==='heatplan'?p.ops.length:4;if(!Number.isInteger(i)||i<0||i>=limit)return;if(p.editIndex!=null&&p.editIndex<p.commands.length){p.commands[p.editIndex]=i;p.editIndex=null}else{if(p.commands.length>=p.limit+3)return;p.commands.push(i)}p.preview=null}else if(action==='edit'){if(Number.isInteger(i)&&i>=0&&i<p.commands.length)p.editIndex=p.editIndex===i?null:i}else if(action==='delete'){if(p.editIndex!=null)p.commands.splice(p.editIndex,1);p.editIndex=null;p.preview=null}else if(action==='undo'){p.commands.pop();p.editIndex=null;p.preview=null}else if(action==='remove'){if(Number.isInteger(i)&&i>=0&&i<p.commands.length)p.commands.splice(i,1);p.preview=null}renderMini()}
function tickMini(now,dt){if(document.hidden||!mini?.running)return;let m=mini,r=m.running;r.elapsed+=dt;if(r.elapsed<.25)return;r.elapsed=0;r.index++;m.puzzle.preview=r.trace.slice(0,r.index+1);if(r.index>=r.trace.length){m.running=null;solvePuzzle()}else renderMini()}
function finishJob(){let m=mini;if(!m||m.paid||m.phase!=='solved'||m.outcomes.length!==3)return;m.paid=true;let pay=wage(m.n)*(3+m.d);state.coins+=pay;state.buildStars++;state.completedJobs++;persist();hud();let list=m.outcomes.map(o=>`<div class="passport-row"><strong>${skillNames[state.lang][o.kind]}</strong><span class="mode-${o.mode}">${tr(o.mode)}</span></div>`).join('');show(say('Gebouwd met je hoofd!','Built with your brain!'),`<div class="game-intro"><div class="payout">+${pay} ● &nbsp; +1 ⭐</div><p class="desc">${say('Je hebt drie verschillende problemen opgelost. Met je bouwster en de juiste tool open je een lucky block.','You solved three different problems. Use your building star and the right tool to open a lucky block.')}</p>${list}<button class="primary wide" data-action="close">${tr('play')}</button><button class="wide" data-action="jobretry">${say('Een nieuw bouwcontract','A new building contract')}</button></div>`);beep(1000)}
function passport(){let items=Object.values(curriculum).flat(),tot=items.reduce((a,k)=>{let s=skill(k);for(let key in a)a[key]+=s[key];return a},{independent:0,repaired:0,assisted:0});show('🧭 '+tr('passport'),`<p class="desc">${say('Wat lukt je al? Dit zijn opgeloste opdrachten in de game. Zelfstandig betekent: een nieuwe opdracht direct goed, zonder hint.','What can you do already? These are tasks solved in this game. Independent means a new task solved on the first check, without a hint.')}</p><div class="passport-totals">${Object.entries(tot).map(([k,v])=>`<div><b>${v}</b><small>${tr(k)}</small></div>`).join('')}</div>${Object.entries(curriculum).map(([type,keys])=>`<h3>${jobIcons[type]} ${tr(type)}</h3>${keys.map(k=>{let r=skill(k);return `<div class="passport-skill"><strong>${skillNames[state.lang][k]}</strong><small>◆ ${r.independent} · ↺ ${r.repaired} · 💡 ${r.assisted}<br>${[1,2,3].map(d=>{let l=state.learning[k]?.levels?.[d]||{};return `N${d}: ${l.independent||0}/${l.repaired||0}/${l.assisted||0}`}).join(' · ')}</small></div>`}).join('')}`).join('')}<p class="tiny">◆ ${tr('independent')} · ↺ ${tr('repaired')} · 💡 ${tr('assisted')}<br>${say('N = niveau; aantallen per niveau staan in dezelfde volgorde.','N = level; counts per level follow the same order.')}</p><p class="tiny">${say('Oude V2-scores zijn geen leerbewijs en zijn niet overgenomen in dit paspoort.','Old V2 scores are not learning evidence and are not included in this passport.')}</p>`)}

function nearestJob(){let arr=[...blocks.values()].filter(b=>jobs.includes(b.type));arr.sort((a,b)=>(Math.abs(a.x-actor.x)+Math.abs(a.y-actor.y))-(Math.abs(b.x-actor.x)+Math.abs(b.y-actor.y)));go(arr[0].x,arr[0].y)}
function blockDialog(b){let s=spec(b.n),tool=state.tools[s.type]>=s.tier,has=tool&&state.buildStars>0;show('✨ '+tr('block'),`<div class="workarea"><div class="workicon">🎁</div><p class="desc">${tr('need')}: ${icons[s.type]} ${tr(types[s.type])} · ${tr('tier')} ${s.tier}<br>⭐ 1 ${tr('buildStar')} (${say('in bezit','owned')}: ${state.buildStars})</p><div class="progress"><i style="width:${b.hp/s.hp*100}%;background:#e8b649"></i></div><p>${b.hp} / ${s.hp}</p><button class="primary wide" data-hit="${key(b.x,b.y)}" ${has?'':'disabled'}>${has?tr('hit'):!tool?tr('upgrade'):say('Verdien eerst een bouwster','Earn a building star first')}</button>${!tool?`<button class="wide" data-action="shop">${tr('shop')}</button>`:''}${!state.buildStars?`<button class="wide" data-action="workshop">${say('Naar een werkplaats','Visit a workshop')}</button>`:''}</div>`)}
function interact(b){if(b.type==='shop')shop();else if(jobs.includes(b.type))job(b);else if(b.type==='block')blockDialog(b);else show('🚙 '+tr('car'),`<p class="desc">${tr('carDesc')}</p><button class="primary wide" data-action="ride">${tr('ride')}</button>`)}
function burst(x,y){for(let i=0;i<30;i++)particles.push({x,y,z:25,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,vz:2+Math.random()*5,life:1,color:['#ffd36f','#fff','#8fddb9','#b29beb','#ff9e91'][i%5]})}
function hit(k){let b=blocks.get(k);if(!b||b.type!=='block')return;let s=spec(b.n);if(state.tools[s.type]<s.tier||state.buildStars<1)return;beep(450+100*(s.hp-b.hp));b.hp--;if(b.hp>0){blockDialog(b);return}let r=reward(b.n);state.coins+=r;state.buildStars--;state.stage++;burst(b.x,b.y);build();close();toast(`${tr('newland')} ✨ +${r} ●`);persist();hud()}
function findPath(tx,ty){let sx=Math.round(actor.x),sy=Math.round(actor.y),queue=[[sx,sy]],prev=new Map([[key(sx,sy),null]]);for(let i=0;i<queue.length;i++){let [x,y]=queue[i];if(x===tx&&y===ty){let route=[],k=key(x,y);while(prev.get(k)!==null){route.push(k.split(',').map(Number));k=prev.get(k)}return route.reverse()}for(let [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){let a=x+dx,b=y+dy,k=key(a,b);if(tiles.has(k)&&!blocks.has(k)&&!prev.has(k)){prev.set(k,key(x,y));queue.push([a,b])}}}return null}
function go(x,y){if(!tiles.has(key(x,y))){toast(tr('locked'));return}let b=blocks.get(key(x,y));if(travel){if(b){toast(tr('travel'));return}path=[];pending=null;actor={x,y};state.player={x,y};travel=false;burst(x,y);center();beep(900);persist();hud();return}let route;if(b){let routes=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>findPath(x+dx,y+dy)).filter(Boolean);routes.sort((a,b)=>a.length-b.length);route=routes[0];pending=b}else{route=findPath(x,y);pending=null}if(!route){pending=null;return}path=route;if(!path.length&&pending){let p=pending;pending=null;interact(p)}}
function menu(m){if(m==='passport')passport();if(m==='help')help();if(m==='bag')bag();if(m==='jobs')nearestJob();if(m==='shop'){let b=[...blocks.values()].find(b=>b.type==='shop');go(b.x,b.y)}}
$('toolbar').onclick=e=>{let b=e.target.closest('[data-menu]');if(b)menu(b.dataset.menu)};
modal.onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.difficulty){state.jobDifficulty=+b.dataset.difficulty;persist();job(jobPlace);return}if(b.dataset.game!==undefined){gameAction(b.dataset.game,b.dataset.value);return}if(b.dataset.buy!==undefined){let i=+b.dataset.buy,c=cost(state.tools[i]+1);if(state.coins<c)return;state.coins-=c;state.tools[i]++;persist();hud();shop();beep(800);toast(tr('bought'));return}if(b.dataset.hit){hit(b.dataset.hit);return}switch(b.dataset.action){case'close':close();break;case'shop':shop();break;case'ride':travel=true;close();hud();break;case'workshop':close();nearestJob();break;case'jobstart':startJob();break;case'jobretry':job(jobPlace);break;case'sound':state.sound=!state.sound;persist();help();break;case'reset':show(tr('reset'),`<p class="desc">${tr('resetAsk')}</p><button class="wide" data-action="help">${tr('no')}</button><button class="primary wide" data-action="confirmreset">${tr('yes')}</button>`);break;case'help':help();break;case'confirmreset':{let lang=state.lang;state=fresh();state.lang=lang;actor={x:0,y:0};path=[];pending=null;travel=false;build();center();persist();hud();close();break}}};modal.addEventListener('close',()=>mini=null);
$('lang').onclick=()=>{state.lang=state.lang==='nl'?'en':'nl';persist();hud()};
function resize(){W=innerWidth;H=innerHeight;let dpr=Math.min(2,devicePixelRatio||1);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
function project(x,y,z=0){return{x:W/2+(x-y)*42*zoom+cam.x,y:H*.52+(x+y)*22*zoom+cam.y-z*zoom}}
function unproject(x,y){let a=(x-W/2-cam.x)/(42*zoom),b=(y-H*.52-cam.y)/(22*zoom);return{x:Math.round((a+b)/2),y:Math.round((b-a)/2)}}
function center(){cam.x=-(actor.x-actor.y)*42*zoom;cam.y=-(actor.x+actor.y)*22*zoom+(W<760?20:0)}
function setZoom(z){zoom=Math.max(.45,Math.min(1.7,z));center()}
$('zoomin').onclick=()=>setZoom(zoom+.15);$('zoomout').onclick=()=>setZoom(zoom-.15);$('home').onclick=center;
canvas.onpointerdown=e=>{pan={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{hover=unproject(e.clientX,e.clientY);if(pan){let dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(Math.hypot(dx,dy)>7)pan.moved=true;if(pan.moved){cam.x=pan.cx+dx;cam.y=pan.cy+dy}}};
canvas.onpointerup=e=>{if(pan&&!pan.moved){let found=null;for(let b of [...blocks.values()].sort((a,b)=>(b.x+b.y)-(a.x+a.y))){let p=project(b.x,b.y);if(Math.abs(e.clientX-p.x)<30*zoom&&e.clientY>p.y-65*zoom&&e.clientY<p.y+10*zoom){found=b;break}}let p=found||unproject(e.clientX,e.clientY);go(p.x,p.y)}pan=null};canvas.onpointercancel=()=>pan=null;
canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom-e.deltaY*.001)},{passive:false});
function move(dx,dy){if(modal.open||path.length)return;let x=Math.round(actor.x)+dx,y=Math.round(actor.y)+dy;go(x,y);center()}
document.addEventListener('keydown',e=>{if(modal.open)return;if(e.key==='Escape'){travel=false;hud();return}let dirs={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(dirs[e.key]){e.preventDefault();move(...dirs[e.key])}});$('mobilepad').onclick=e=>{if(e.target.dataset.dir)move(...e.target.dataset.dir.split(',').map(Number))};
function poly(points,fill,stroke){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function box(x,y,w,d,h,top,left,right){poly([[x-w,y],[x,y+d],[x,y+d-h],[x-w,y-h]],left);poly([[x,y+d],[x+w,y],[x+w,y-h],[x,y+d-h]],right);poly([[x-w,y-h],[x,y-d-h],[x+w,y-h],[x,y+d-h]],top)}
function textAt(s,x,y,size,color='#335954'){ctx.font=`800 ${size}px "Trebuchet MS",sans-serif`;ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(s,x,y)}

function glassify(){for(let el of document.querySelectorAll('.glass,dialog')){if(el.querySelector('.glass-lens'))continue;let lens=document.createElement('canvas');lens.className='glass-lens';lens.setAttribute('aria-hidden','true');el.prepend(lens)}}
function refractGlass(){if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let el of document.querySelectorAll('.glass,dialog[open]')){let lens=el.querySelector('.glass-lens');if(!lens)continue;let r=el.getBoundingClientRect();if(!r.width||!r.height)continue;let w=Math.round(r.width),h=Math.min(Math.round(r.height),innerHeight),scale=canvas.width/W;if(lens.width!==w)lens.width=w;if(lens.height!==h)lens.height=h;let c=lens.getContext('2d');if(!c)continue;c.clearRect(0,0,w,h);c.imageSmoothingEnabled=true;for(let y=0;y<h;y+=5){let band=Math.min(5,h-y),ny=(y-h/2)/(h/2),magnify=1.04+.055*(1-ny*ny),bend=Math.sin(ny*Math.PI)*3;let sx=r.left+w/2-w/(2*magnify)+bend,sy=r.top+h/2+(y-h/2)/1.07;let sw=w/magnify,sh=band/1.07;let left=Math.max(0,sx),top=Math.max(0,sy),right=Math.min(W,sx+sw),bottom=Math.min(H,sy+sh);if(right<=left||bottom<=top)continue;c.drawImage(canvas,left*scale,top*scale,(right-left)*scale,(bottom-top)*scale,(left-sx)*magnify,y,(right-left)*magnify,band)}let shine=c.createLinearGradient(0,0,w,h);shine.addColorStop(0,'#ffffff44');shine.addColorStop(.4,'#ffffff08');shine.addColorStop(.75,'#b9deff18');shine.addColorStop(1,'#ffe3ff33');c.fillStyle=shine;c.fillRect(0,0,w,h)}}

function tile(t,time,locked=false){let p=project(t.x,t.y),z=zoom;if(p.x<-100||p.x>W+100||p.y<-100||p.y>H+130)return;let colors=[['#8fdfb2','#4fa984','#6bc497'],['#f5bbaa','#d58c86','#e9a498'],['#bfc1f2','#9395ca','#a8a8e0'],['#f5da8b','#c9aa59','#e3bf70'],['#8ed8e6','#56a6c2','#72bed2'],['#ddb3e5','#b085bb','#c798d3']],c=colors[t.n%6];if(locked)c=['#e0eae7','#c6d8d1','#d2dfda'];let selected=hover&&hover.x===t.x&&hover.y===t.y&&!locked;box(p.x,p.y,41*z,21*z,10*z,selected?'#e9fbd1':c[0],c[1],c[2]);poly([[p.x-40*z,p.y-10*z],[p.x,p.y-30*z],[p.x+40*z,p.y-10*z],[p.x,p.y+10*z]],'transparent',locked?'#ffffff30':'#ffffff45');if(!locked&&!blocks.has(key(t.x,t.y))&&((t.x*13+t.y*7)%7===0)){ellipse(p.x+10*z,p.y-12*z,3*z,3*z,['#fff4a5','#ff7e9d','#8c74dc'][Math.abs(t.x+t.y)%3]);ellipse(p.x+16*z,p.y-9*z,2.5*z,2.5*z,'#fff3c6');ellipse(p.x+8*z,p.y-7*z,2*z,3*z,'#4daf7f')} }

function drawActor(time){let p=project(actor.x,actor.y),z=zoom,bounce=path.length?Math.sin(time*.018)*3:Math.sin(time*.002)*1.3;ctx.save();ctx.translate(p.x,p.y-10*z);ctx.scale(z,z);ellipse(0,2,13,6,'#39695a30');ctx.translate(0,bounce);ellipse(-5,-3,5,5,'#557c86');ellipse(5,-3,5,5,'#557c86');ellipse(0,-15,11,14,'#f49e8b');ellipse(-12,-15+Math.sin(time*.018)*(path.length?4:0),4,8,'#f9b6a1');ellipse(12,-15-Math.sin(time*.018)*(path.length?4:0),4,8,'#f9b6a1');let grad=ctx.createRadialGradient(-5,-39,1,0,-33,15);grad.addColorStop(0,'#fff7d6');grad.addColorStop(1,'#edc58e');ellipse(0,-34,14,14,grad);ellipse(4,-35,1.5,2,'#3d5a64');ellipse(-4,-35,1.5,2,'#3d5a64');ctx.beginPath();ctx.arc(0,-31,4,.15,Math.PI-.15);ctx.strokeStyle='#906958';ctx.lineWidth=1.5;ctx.stroke();ellipse(-8,-31,3,1.5,'#f5b49c');ellipse(8,-31,3,1.5,'#f5b49c');ctx.restore()}
function frame(time){let dt=Math.min((time-last)/1000,.04);last=time;if(path.length){let [x,y]=path[0],dx=x-actor.x,dy=y-actor.y,dist=Math.hypot(dx,dy),speed=dt*5;if(dist<=speed){actor={x,y};path.shift();if(!path.length){persist();if(pending){let p=pending;pending=null;interact(p)}}}else{actor.x+=dx/dist*speed;actor.y+=dy/dist*speed}let p=project(actor.x,actor.y);if(p.x<110||p.x>W-100||p.y<180||p.y>H-170){cam.x+=(W/2-p.x)*dt*4;cam.y+=(H*.55-p.y)*dt*4}}
ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#c6f4e1');bg.addColorStop(.46,'#b9e6f0');bg.addColorStop(1,'#edcef0');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.45;ellipse(W*.83,H*.22,180,55,'white');ellipse(W*.14,H*.73,170,50,'white');ctx.globalAlpha=1;let aura=ctx.createRadialGradient(W*.24,H*.26,0,W*.24,H*.26,W*.44);aura.addColorStop(0,'#fff4b75c');aura.addColorStop(1,'#fff4b700');ctx.fillStyle=aura;ctx.fillRect(0,0,W,H);

ctx.strokeStyle='#ffffffb0';ctx.lineWidth=2*zoom;ctx.setLineDash([5*zoom,5*zoom]);for(let t of visible){let p=project(t.x,t.y),z=zoom;for(let [dx,dy,a,b]of [[-1,0,[-42,0],[0,-22]],[0,-1,[0,-22],[42,0]],[1,0,[42,0],[0,22]],[0,1,[0,22],[-42,0]]])if(!tiles.has(key(t.x+dx,t.y+dy))){ctx.beginPath();ctx.moveTo(p.x+a[0]*z,p.y+(a[1]-10)*z);ctx.lineTo(p.x+b[0]*z,p.y+(b[1]-10)*z);ctx.stroke()}}ctx.setLineDash([]);
let objects=[...blocks.values(),{...actor,type:'player'}].sort((a,b)=>(a.x+a.y)-(b.x+b.y));for(let b of objects)b.type==='player'?drawActor(time):drawObject(b,time);
for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt*30;p.vz-=dt*9;p.life-=dt*.65;let a=project(p.x,p.y,p.z);ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(a.x,a.y,5*zoom,5*zoom)}particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;tickMini(time,dt);if(time-lastGlass>90){refractGlass();lastGlass=time;}requestAnimationFrame(frame)}
